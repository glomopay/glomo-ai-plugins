name: sync-skills

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/sync-skills.mjs
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: chore/sync-skills
          commit-message: Sync skills from docs.glomo.one
          title: Sync skills from docs.glomo.one
          body: |
            Skills changed in the Glomo docs catalogue (`https://docs.glomo.one/.well-known/skills/`).
            This PR copies them into `plugins/glomo/skills/` and bumps the plugin patch version, so installs pick them up on merge.

            The validate check doesn't start on PRs opened by this workflow. Close and reopen this PR to run it before merging.
          delete-branch: true
