name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace
        run: claude plugin validate --strict .
      - name: Validate the plugin
        run: claude plugin validate --strict plugins/glomo
      - name: MCP config points at the glomo server
        run: jq -e '.mcpServers.glomo.type == "http" and (.mcpServers.glomo.url | startswith("https://"))' plugins/glomo/.mcp.json
